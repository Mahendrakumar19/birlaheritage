services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: birla_heritage
      POSTGRES_USER: birla_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birla_app -d birla_heritage"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://birla_app:${POSTGRES_PASSWORD}@postgres:5432/birla_heritage
      CORS_ORIGINS: ${PUBLIC_WEB_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      ALLOW_ADMIN_SIGNUP: "false"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
